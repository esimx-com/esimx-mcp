name: Manual read-only remote smoke
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type READ_ONLY to authorize this bounded public catalog check'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: remote-smoke
  cancel-in-progress: false
jobs:
  remote-smoke:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.confirm == 'READ_ONLY'
    environment: remote-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run smoke -- --confirm-read-only
