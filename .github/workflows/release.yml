name: Prepare release archive
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Reviewed version from project.json (no v prefix)'
        required: true
        type: string
      confirm:
        description: 'Type PREPARE to build a workflow artifact; this does not publish a release'
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.confirm == 'PREPARE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.14
      - run: npm ci
      - run: uv sync --locked
      - run: npm run generate -- --check
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:python
      - name: Check version and tracked-file boundary
        run: |
          node --input-type=module -e 'import p from "./project.json" with {type:"json"}; if (p.version !== process.env.REQUESTED_VERSION) throw new Error("Requested version differs from project.json")'
          if git ls-files | grep -E '(^|/)(\.local|node_modules|\.venv|dist|__pycache__|\.env)(/|\.|$)'; then
            echo 'Private or generated build files are tracked; stop packaging.' >&2
            exit 1
          fi
      - name: Create source archive and checksum
        run: |
          version=$(node --input-type=module -e 'import p from "./project.json" with {type:"json"}; console.log(p.version)')
          mkdir -p "$RUNNER_TEMP/release"
          git archive --format=tar.gz --prefix="esimx-mcp-$version/" HEAD > "$RUNNER_TEMP/release/esimx-mcp-$version.tar.gz"
          cd "$RUNNER_TEMP/release"
          sha256sum "esimx-mcp-$version.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esimx-mcp-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14
